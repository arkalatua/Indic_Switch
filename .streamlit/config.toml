# Production-safe defaults for the IndicSwitch demo.

[server]
headless = true
# Listen only on this machine by default, so the plain-HTTP dev server is not
# exposed to the local network. For deployment, run behind an HTTPS reverse
# proxy and override: --server.address 0.0.0.0 (Streamlit Community Cloud and
# Hugging Face Spaces handle this and serve HTTPS automatically).
address = "localhost"
# Reject uploads above 25 MB before they reach app code (the app also checks).
maxUploadSize = 25
maxMessageSize = 50
# Cross-site request forgery protection (requires CORS protection too).
enableXsrfProtection = true
enableCORS = true
# No auto-reload / file watching in deployment.
runOnSave = false
fileWatcherType = "none"

[client]
# Browsers only see generic error messages; tracebacks go to the server console.
# (Note: the legacy value `false` would still show stack traces.)
showErrorDetails = "none"
# Hide developer options (rerun, clear cache, deploy) from visitors.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
